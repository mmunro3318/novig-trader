<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novig Trader</title><link rel="stylesheet" href="trade.css?v=5"></head><body>
<header>
  <span class="brand">NOVIG TRADER</span><span id="env" class="badge paper">…</span><span id="ord" class="badge off">orders …</span>
  <span class="hctl" data-tip="Max slippage: a buy never fills more than this many cents above the ask">slip <select id="slip"><option>1</option><option selected>2</option><option>3</option><option>5</option></select>¢</span>
  <button class="btn ghost" id="setBtn" data-tip="Settings: loss cap, per-order cap, time zone">⚙</button>
  <button class="btn red" id="flatAll" data-tip="Sell every open position in the tradable wallet now">FLATTEN ALL</button>
  <span class="hctl"><span id="conn"></span><span id="age"></span></span>
  <span class="spacer"></span>
  <div class="hero num" id="hero">
    <div class="eq" id="hEq" data-tip="Account value: cash + open positions at sell-now prices">–</div>
    <div class="sub"><span class="cash" id="hCash" data-tip="Available cash">–</span><span class="open" id="hOpen" data-tip="Open positions value (sell-now)">–</span><span id="hDay" data-tip="Today's P&L (realized + open, after exit fees)">–</span></div>
    <div class="hside">
      <span class="wr" id="hWr" data-tip="Win rate: closed trades that made money (all time on this wallet)">–</span><span class="cnt" id="hCnt" data-tip="Open positions">–</span>
      <span class="mut" id="hExp" data-tip="Est. return if every open position is held to the end, weighted by its market win chance">–</span><span class="tot" id="hTot" data-tip="Total profit/loss: realized all time + open">–</span>
    </div>
  </div>
</header>
<div id="err"></div><div id="alerts"></div>
<main>
  <section class="panel" id="gamesPanel">
    <div class="filters">
      <div class="row"><input type="search" id="fq" placeholder="Search teams…"><button class="pill" id="fMine" data-tip="Only games you have a position in">★ Mine</button></div>
      <div class="row" id="fSport"></div>
      <div class="row">
        <select id="fStatus"><option value="">All status</option><option value="live">Live</option><option value="upcoming">Upcoming</option><option value="past">Past</option></select>
        <select id="fDate"><option value="today">Today</option><option value="tomorrow">Tomorrow</option><option value="">All dates</option></select>
        <span class="mut" id="tzLab"></span>
      </div>
    </div>
    <div id="glist">loading…</div>
  </section>
  <div class="col">
    <section class="panel" id="mktPanel"><h3><span class="mtitle" id="mtitle">Pick a game</span></h3><div id="mgrid"></div><div id="ticket"></div></section>
    <section class="panel" style="flex:0 0 34%"><h3>Orders · receipts (newest first)</h3><div id="ilist"></div></section>
  </div>
  <section class="panel"><h3>Positions</h3><div id="psum"></div><div id="plist">loading…</div></section>
</main>
<div id="toasts"></div>
<div id="modal"><div class="box"><h4 id="mH"></h4><div id="mB"></div><div class="btns" style="justify-content:flex-end;margin-top:12px"><button class="btn h" id="mNo">Cancel</button><button class="btn" id="mYes">Confirm</button></div></div></div>
<div id="pop"></div>
<script src="trade.js?v=5"></script>
</body></html>
