<!doctype html><meta charset=utf-8><title>Novig UI concepts</title><body style="background:#111;color:#fff;font-family:system-ui;padding:30px"><h1>Novig UI concepts — round 1</h1><p style="opacity:.6">Sample: CIN @ BAL, Q3, Ravens YES 0.58 after a pick-six overreaction. Your position 86 @ 0.41 (sample).</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:28px"><a href="01-terminal.html" style="color:#fff;text-decoration:none"><figure style="margin:0"><img src="01-terminal.png" style="width:100%;border-radius:8px"><figcaption><b>Bloomberg Terminal</b><br><span style="opacity:.6">Density over decoration: amber-on-black, monospace, keyboard-first, every pixel is data.</span></figcaption></figure></a><a href="02-glass.html" style="color:#fff;text-decoration:none"><figure style="margin:0"><img src="02-glass.png" style="width:100%;border-radius:8px"><figcaption><b>Aurora Glass</b><br><span style="opacity:.6">Calm premium consumer fintech: frosted panels floating over a soft gradient, big numbers, generous space.</span></figcaption></figure></a><a href="03-brutalist.html" style="color:#fff;text-decoration:none"><figure style="margin:0"><img src="03-brutalist.png" style="width:100%;border-radius:8px"><figcaption><b>Neo-Brutalist</b><br><span style="opacity:.6">Loud, honest, tactile: thick black borders, hard offset shadows, flat primaries, giant type. Feels like a fanzine trading desk.</span></figcaption></figure></a><a href="04-win95.html" style="color:#fff;text-decoration:none"><figure style="margin:0"><img src="04-win95.png" style="width:100%;border-radius:8px"><figcaption><b>Windows 95 Desktop</b><br><span style="opacity:.6">Nostalgic neo-retro OS: each widget is a draggable window, bevels and system fonts. Your Soul Reaver era, made playful.</span></figcaption></figure></a><a href="05-swiss.html" style="color:#fff;text-decoration:none"><figure style="margin:0"><img src="05-swiss.png" style="width:100%;border-radius:8px"><figcaption><b>Swiss Editorial</b><br><span style="opacity:.6">International Typographic Style: strict grid, one red accent, the game told like a newspaper front page.</span></figcaption></figure></a><a href="06-hud.html" style="color:#fff;text-decoration:none"><figure style="margin:0"><img src="06-hud.png" style="width:100%;border-radius:8px"><figcaption><b>Sci-Fi HUD</b><br><span style="opacity:.6">Tactical heads-up display: cyan wireframes, corner brackets, scanlines, radial gauges. The game as a mission.</span></figcaption></figure></a><a href="07-eink.html" style="color:#fff;text-decoration:none"><figure style="margin:0"><img src="07-eink.png" style="width:100%;border-radius:8px"><figcaption><b>E-Ink Calm</b><br><span style="opacity:.6">Paper-quiet, grayscale, serif: designed to lower heart rate mid-swing and make rules louder than noise.</span></figcaption></figure></a><a href="08-sportsbook.html" style="color:#fff;text-decoration:none"><figure style="margin:0"><img src="08-sportsbook.png" style="width:100%;border-radius:8px"><figcaption><b>Neon Sportsbook</b><br><span style="opacity:.6">DraftKings/Kalshi energy: dark, team colors, chunky tap targets, live pulse — built for thumbs and speed.</span></figcaption></figure></a></div>
